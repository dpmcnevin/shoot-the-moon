name: ShootTheMoon
options:
  bundleIdPrefix: net.corrupt
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

targets:
  ShootTheMoon:
    type: application
    platform: iOS
    sources:
      - path: ShootTheMoon
    settings:
      base:
        PRODUCT_NAME: Shoot the Moon
        PRODUCT_BUNDLE_IDENTIFIER: net.corrupt.shoot-the-moon
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UIStatusBarHidden: true
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: false
        INFOPLIST_KEY_CFBundleDisplayName: Shoot the Moon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      - name: "Build JS engine bundle and audio"
        script: |
          set -e
          # Xcode's build PATH omits Homebrew and nvm; add the usual places.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.npm-global/bin:$PATH"
          if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1 || true; fi
          cd "$SRCROOT/.."
          npm run --silent build:ios-bridge
          # The audio takes a few seconds to render; only when missing.
          if [ ! -f ios/ShootTheMoon/Resources/Audio/music.json ]; then npm run --silent render-audio; fi
        basedOnDependencyAnalysis: false
