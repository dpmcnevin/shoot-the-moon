name: Deploy to GitHub Pages

# Tests the engine and the kit, builds the web game (web/) and the arcade
# (arcade/), and publishes them with GitHub Pages, the same way isle-wars is
# published. With the account's custom domain the game is served at
# https://corrupt.net/shoot-the-moon/ and the arcade under /arcade/, with a
# page per game: /arcade/hearts/, /arcade/bridge/, /arcade/euchre/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:kit
      # The base path follows the repository name, so a rename just works.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # The arcade, built into the same site under /arcade/.
      - run: npm -w arcade run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/arcade
      - run: cp -r arcade/build web/build/arcade
      - name: Add .nojekyll to bypass GitHub Pages Jekyll processing
        run: touch web/build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # Pages occasionally reports a transient "Deployment failed, try again
      # later"; retry up to three times, as isle-wars does.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
