name: ShootTheMoon
options:
  bundleIdPrefix: net.corrupt
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

# Tells Xcode the project is already on its recommended settings, so it
# stops offering to update them (the project is regenerated, so any update
# made in Xcode would be lost anyway).
attributes:
  LastUpgradeCheck: "2720"

settings:
  base:
    DEVELOPMENT_TEAM: 225QC53X87
    CODE_SIGN_STYLE: Automatic
    # The pre-build step reads the engine from the web repo, outside this
    # folder, so it can't run sandboxed.
    ENABLE_USER_SCRIPT_SANDBOXING: false
    STRING_CATALOG_GENERATE_SYMBOLS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true

targets:
  ShootTheMoon:
    type: application
    platform: iOS
    info:
      path: ShootTheMoon/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The launch screen in the game's background color, not black.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fonts/Jersey10-Regular.ttf
    sources:
      - path: ShootTheMoon
        excludes:
          - "Resources/**"
      # Made by the pre-build step, so they may not exist yet when the
      # project is generated: list them by name rather than by scanning.
      - path: ShootTheMoon/Resources/game-bundle.js
        optional: true
        buildPhase: resources
      - path: ShootTheMoon/Resources/engine-version.txt
        optional: true
        buildPhase: resources
      - path: ShootTheMoon/Resources/Audio
        type: folder
        optional: true
        buildPhase: resources
      # The pixel font (Jersey 10, SIL Open Font License; see Fonts/OFL.txt).
      - path: ShootTheMoon/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Shoot the Moon
        PRODUCT_BUNDLE_IDENTIFIER: net.corrupt.shoot-the-moon
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Not resizable. Deprecated since iOS 26 but still honored; the app
        # also pins its window to the screen size (lockWindow) for when it isn't.
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UIStatusBarHidden: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: false
        INFOPLIST_KEY_CFBundleDisplayName: Shoot the Moon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      - name: "Build JS engine bundle and audio"
        script: |
          set -e
          # Xcode's build PATH omits Homebrew and nvm; add the usual places.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.npm-global/bin:$PATH"
          if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1 || true; fi
          # The engine lives beside this app in the same repo (../engine).
          ROOT="$SRCROOT/.."
          RES="$SRCROOT/ShootTheMoon/Resources"
          cd "$ROOT"
          [ -d node_modules ] || npm install --silent
          BRIDGE_OUT="$RES/game-bundle.js" npm run --silent -w engine build:bridge
          # Record which commit this build used (shown on the menu).
          git -C "$ROOT" describe --always --dirty --abbrev=7 > "$RES/engine-version.txt" 2>/dev/null || echo unknown > "$RES/engine-version.txt"
          # The audio takes a few seconds to render; only when missing.
          if [ ! -f "$RES/Audio/music.json" ]; then node engine/tools/render-audio.ts "$RES/Audio"; fi
        basedOnDependencyAnalysis: false
        # Declared so Xcode copies the fresh files, not the previous build's.
        outputFiles:
          - $(SRCROOT)/ShootTheMoon/Resources/game-bundle.js
          - $(SRCROOT)/ShootTheMoon/Resources/engine-version.txt
